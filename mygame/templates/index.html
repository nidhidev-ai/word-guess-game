<!DOCTYPE html>
<html>
<head>
  <title>Word Guess Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial; 
      text-align: center; 
      background: #1a1a2e; 
      color: white; 
      padding: 20px; 
    }
    h1 { color: #e94560; font-size: 36px; margin-bottom: 10px; }
    #score { font-size: 20px; margin: 10px; }
    #timer { font-size: 32px; color: #e94560; font-weight: bold; margin: 10px; }
    #board { 
      display: grid; 
      grid-template-rows: repeat(6, 1fr);
      gap: 5px; 
      width: 300px; 
      margin: 20px auto; 
    }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .cell { 
      width: 54px; height: 54px; 
      border: 2px solid #555; 
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold;
      text-transform: uppercase;
      background: #16213e;
      transition: transform 0.1s;
    }
    .correct { background: #538d4e !important; border-color: #538d4e; }
    .present { background: #b59f3b !important; border-color: #b59f3b; }
    .absent  { background: #3a3a3c !important; border-color: #3a3a3c; }

    /* Keyboard */
    #keyboard { margin: 20px auto; width: 340px; }
    .key-row { display: flex; justify-content: center; gap: 5px; margin: 5px 0; }
    .key { 
      padding: 15px 10px;
      min-width: 32px;
      background: #818384;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .key:hover { opacity: 0.8; }
    .key.wide { min-width: 50px; font-size: 11px; }
    .key.correct { background: #538d4e; }
    .key.present { background: #b59f3b; }
    .key.absent { background: #3a3a3c; }

    #message { font-size: 22px; margin-top: 15px; color: #e94560; font-weight: bold; }
    #hint-btn {
      display: block; margin: 10px auto;
      padding: 10px 24px; font-size: 18px;
      background: #b59f3b; color: white;
      border: none; border-radius: 8px; cursor: pointer;
    }
    #new-game-btn {
      display: none; margin: 10px auto;
      padding: 10px 24px; font-size: 18px;
      background: #538d4e; color: white;
      border: none; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎮 Word Guess Game</h1>
  <p style="color:#aaa">Guess the 5-letter word in 6 tries!</p>

  <div id="score">
    🏆 Wins: <span id="wins">0</span> | 💀 Losses: <span id="losses">0</span>
  </div>

  <div id="timer">⏱️ 60</div>

  <div id="board">
    <div class="row" id="row-0"></div>
    <div class="row" id="row-1"></div>
    <div class="row" id="row-2"></div>
    <div class="row" id="row-3"></div>
    <div class="row" id="row-4"></div>
    <div class="row" id="row-5"></div>
  </div>

  <!-- On Screen Keyboard -->
  <div id="keyboard">
    <div class="key-row">
      <button class="key" onclick="pressKey('Q')">Q</button>
      <button class="key" onclick="pressKey('W')">W</button>
      <button class="key" onclick="pressKey('E')">E</button>
      <button class="key" onclick="pressKey('R')">R</button>
      <button class="key" onclick="pressKey('T')">T</button>
      <button class="key" onclick="pressKey('Y')">Y</button>
      <button class="key" onclick="pressKey('U')">U</button>
      <button class="key" onclick="pressKey('I')">I</button>
      <button class="key" onclick="pressKey('O')">O</button>
      <button class="key" onclick="pressKey('P')">P</button>
    </div>
    <div class="key-row">
      <button class="key" onclick="pressKey('A')">A</button>
      <button class="key" onclick="pressKey('S')">S</button>
      <button class="key" onclick="pressKey('D')">D</button>
      <button class="key" onclick="pressKey('F')">F</button>
      <button class="key" onclick="pressKey('G')">G</button>
      <button class="key" onclick="pressKey('H')">H</button>
      <button class="key" onclick="pressKey('J')">J</button>
      <button class="key" onclick="pressKey('K')">K</button>
      <button class="key" onclick="pressKey('L')">L</button>
    </div>
    <div class="key-row">
      <button class="key wide" onclick="submitGuess()">ENTER</button>
      <button class="key" onclick="pressKey('Z')">Z</button>
      <button class="key" onclick="pressKey('X')">X</button>
      <button class="key" onclick="pressKey('C')">C</button>
      <button class="key" onclick="pressKey('V')">V</button>
      <button class="key" onclick="pressKey('B')">B</button>
      <button class="key" onclick="pressKey('N')">N</button>
      <button class="key" onclick="pressKey('M')">M</button>
      <button class="key wide" onclick="deleteLetter()">⌫</button>
    </div>
  </div>

  <div id="message"></div>
  <button id="hint-btn" onclick="giveHint()">💡 Hint (3 left)</button>
  <button id="new-game-btn" onclick="location.reload()">🔄 New Game</button>

  <script>
    const word = "{{ word }}";
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;
    let hints = 3;
    let currentGuess = '';

    let wins = parseInt(localStorage.getItem('wins') || 0);
    let losses = parseInt(localStorage.getItem('losses') || 0);
    document.getElementById('wins').textContent = wins;
    document.getElementById('losses').textContent = losses;

    // Timer
    let timeLeft = 60;
    let timerInterval = setInterval(function() {
      timeLeft--;
      document.getElementById('timer').textContent = '⏱️ ' + timeLeft;
      if (timeLeft <= 10) {
        document.getElementById('timer').style.color = 'red';
      }
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        gameOver = true;
        document.getElementById('message').textContent = '⏰ Time up! The word was ' + word;
        document.getElementById('new-game-btn').style.display = 'block';
        losses++;
        localStorage.setItem('losses', losses);
        document.getElementById('losses').textContent = losses;
      }
    }, 1000);

    // Build board
    for (let r = 0; r < 6; r++) {
      const row = document.getElementById('row-' + r);
      for (let c = 0; c < 5; c++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.id = 'cell-' + r + '-' + c;
        row.appendChild(cell);
      }
    }

    // Keyboard press
    function pressKey(letter) {
      if (gameOver) return;
      if (currentGuess.length < 5) {
        currentGuess += letter;
        document.getElementById('cell-' + currentRow + '-' + (currentGuess.length - 1)).textContent = letter;
      }
    }

    // Delete letter
    function deleteLetter() {
      if (gameOver) return;
      if (currentGuess.length > 0) {
        document.getElementById('cell-' + currentRow + '-' + (currentGuess.length - 1)).textContent = '';
        currentGuess = currentGuess.slice(0, -1);
      }
    }

    // Physical keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitGuess();
      else if (e.key === 'Backspace') deleteLetter();
      else if (e.key.match(/^[a-zA-Z]$/)) pressKey(e.key.toUpperCase());
    });

    function submitGuess() {
      if (gameOver) return;
      if (currentGuess.length !== 5) {
        document.getElementById('message').textContent = '⚠️ Enter a 5 letter word!';
        return;
      }

      fetch('/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guess: currentGuess, word: word })
      })
      .then(res => res.json())
      .then(result => {
        for (let c = 0; c < 5; c++) {
          const cell = document.getElementById('cell-' + currentRow + '-' + c);
          cell.classList.add(result[c]);

          // Update keyboard colors
          const keyBtn = document.querySelector(`button.key[onclick="pressKey('${currentGuess[c]}')"]`);
          if (keyBtn) {
            if (result[c] === 'correct') keyBtn.className = 'key correct';
            else if (result[c] === 'present' && !keyBtn.classList.contains('correct')) keyBtn.className = 'key present';
            else if (result[c] === 'absent' && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) keyBtn.className = 'key absent';
          }
        }

        if (currentGuess === word) {
          clearInterval(timerInterval);
          document.getElementById('message').textContent = '🎉 You got it! The word was ' + word + '!';
          gameOver = true;
          wins++;
          localStorage.setItem('wins', wins);
          document.getElementById('wins').textContent = wins;
          document.getElementById('new-game-btn').style.display = 'block';
        } else if (currentRow === 5) {
          clearInterval(timerInterval);
          document.getElementById('message').textContent = '😢 Game over! The word was ' + word;
          gameOver = true;
          losses++;
          localStorage.setItem('losses', losses);
          document.getElementById('losses').textContent = losses;
          document.getElementById('new-game-btn').style.display = 'block';
        } else {
          document.getElementById('message').textContent = '';
        }
        currentRow++;
        currentGuess = '';
      });
    }

    function giveHint() {
      if (hints <= 0) { alert('No hints left!'); return; }
      if (gameOver) return;
      for (let c = 0; c < 5; c++) {
        const cell = document.getElementById('cell-' + currentRow + '-' + c);
        if (cell.textContent === '') {
          cell.textContent = word[c];
          cell.style.color = '#b59f3b';
          currentGuess += word[c];
          hints--;
          document.getElementById('hint-btn').textContent = '💡 Hint (' + hints + ' left)';
          break;
        }
      }
    }
  </script>
</body>
</html>
